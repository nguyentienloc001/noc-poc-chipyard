services:
  chipyard:
    # Image build bằng build.sh (root of trust) hoặc pull từ Docker Hub.
    # Override: DOCKER_IMAGE=<user>/noc-poc-chipyard DOCKER_TAG=<tag> docker compose run --rm chipyard
    image: ${DOCKER_IMAGE:-local/noc-poc-chipyard}:${DOCKER_TAG:-latest}
    # Không pin platform — image multi-arch, chạy native trên cả M1 (arm64) và x86 (amd64)
    volumes:
      - ../..:/project           # repo root (compose file nằm ở src/docker/)
      - chipyard-vol:/work       # chipyard source + build output (persist)
      - home-vol:/home/dev       # sbt/coursier/ivy cache (persist — tránh re-fetch mỗi lần run --rm)
    working_dir: /work
    environment:
      - MAKEFLAGS=-j8            # chỉnh theo số core máy
      - RISCV=/work/riscv        # install prefix cho spike/pk/tests (flow không-conda, P0 E9)
      # /work/riscv/bin lên đầu PATH: spike/elf2hex/espresso install vào volume (P0 step 3)
      - PATH=/work/riscv/bin:/opt/sbt/bin:/opt/firtool/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      # Provenance passthrough cho run_sim.sh meta.txt (docs/04 §3) — data chính
      # thức phải set DOCKER_IMAGE/DOCKER_TAG theo pin + IMAGE_DIGEST
      - DOCKER_IMAGE=${DOCKER_IMAGE:-local/noc-poc-chipyard}
      - DOCKER_TAG=${DOCKER_TAG:-latest}
      - IMAGE_DIGEST=${IMAGE_DIGEST:-}
    stdin_open: true
    tty: true

volumes:
  chipyard-vol:
  home-vol:
